name: ragmark-eval-template

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  evaluate-pr:
    runs-on: ubuntu-latest
    outputs:
      results-path: ${{ steps.evaluate.outputs.results-path }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}  # or github.event.pull_request.head.sha
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run evaluation
        id: evaluate
        run: |
          # Customize the following line to point to your config file and dataset
          rageval run ./path/to/config.yaml --output ./pr-results.json
          echo "results-path=./pr-results.json" >> $GITHUB_OUTPUT
  evaluate-main:
    runs-on: ubuntu-latest
    outputs:
      results-path: ${{ steps.evaluate.outputs.results-path }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run evaluation
        id: evaluate
        run: |
          # Customize the following line to point to your config file and dataset
          rageval run ./path/to/config.yaml --output ./main-results.json
          echo "results-path=./main-results.json" >> $GITHUB_OUTPUT
  comment:
    runs-on: ubuntu-latest
    needs: [evaluate-pr, evaluate-main]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Compare results
        id: compare
        run: |
          rageval compare ${{ needs.evaluate-pr.outputs.results-path }} ${{ needs.evaluate-main.outputs.results-path }} --output ./comparison.md
      - name: Post comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: ./comparison.md
          header: "ragmark-eval-results"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}