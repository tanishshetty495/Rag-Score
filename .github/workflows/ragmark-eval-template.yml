name: ragmark-eval-template

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  evaluate-pr:
    runs-on: ubuntu-latest
    outputs:
      results-path: ${{ steps.evaluate.outputs.results-path }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}  # or github.event.pull_request.head.sha
      - name: Set up Python
        uses: actions/setup-python=v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Cache judge cache directory
        uses: actions/cache@v4
        with:
          path: .ragmark_cache
          key: ${{ runner.os }}-judge-cache-${{ hashFiles('**/eval_config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-judge-cache-
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run evaluation
        id: evaluate
        run: |
          if [ ! -f eval_config.yaml ]; then
            echo "# Temporary config file for the CI/CD workflow." > eval_config.yaml
            echo "# Replace this with your own pipeline's configuration." >> eval_config.yaml
            echo "# See https://github.com/tanishshetty495/Rag-Score/blob/main/docs/configuration.md for details." >> eval_config.yaml
            echo "" >> eval_config.yaml
            echo "dataset: test_smoke/test_set.json" >> eval_config.yaml
            echo "retriever: test_smoke.fake_pipeline:my_retriever" >> eval_config.yaml
            echo "generator: test_smoke.fake_pipeline:my_generator" >> eval_config.yaml
            echo "metrics: [precision_at_5]" >> eval_config.yaml
            echo "output: ./eval_results.json" >> eval_config.yaml
          fi
          # Use the config file at ./eval_config.yaml
          # Replace this with your own config file path and adjust the output field in the config.
          rageval run ./eval_config.yaml
          echo "results-path=./eval_results.json" >> $GITHUB_OUTPUT
  evaluate-main:
    runs-on: ubuntu-latest
    outputs:
      results-path: ${{ steps.evaluate.outputs.results-path }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python=v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Cache judge cache directory
        uses: actions/cache@v4
        with:
          path: .ragmark_cache
          key: ${{ runner.os }}-judge-cache-${{ hashFiles('**/eval_config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-judge-cache-
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run evaluation
        id: evaluate
        run: |
          if [ ! -f eval_config.yaml ]; then
            echo "# Temporary config file for the CI/CD workflow." > eval_config.yaml
            echo "# Replace this with your own pipeline's configuration." >> eval_config.yaml
            echo "# See https://github.com/tanishshetty495/Rag-Score/blob/main/docs/configuration.md for details." >> eval_config.yaml
            echo "" >> eval_config.yaml
            echo "dataset: test_smoke/test_set.json" >> eval_config.yaml
            echo "retriever: test_smoke.fake_pipeline:my_retriever" >> eval_config.yaml
            echo "generator: test_smoke.fake_pipeline:my_generator" >> eval_config.yaml
            echo "metrics: [precision_at_5]" >> eval_config.yaml
            echo "output: ./eval_results.json" >> eval_config.yaml
          fi
          # Use the config file at ./eval_config.yaml
          # Replace this with your own config file path and adjust the output field in the config.
          rageval run ./eval_config.yaml
          echo "results-path=./eval_results.json" >> $GITHUB_OUTPUT
  comment:
    runs-on: ubuntu-latest
    needs: [evaluate-pr, evaluate-main]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python=v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Compare results
        id: compare
        run: |
          rageval compare ${{ needs.evaluate-pr.outputs.results-path }} ${{ needs.evaluate-main.outputs.results-path }} --output ./comparison.md

      # Optional: Add quality gate evaluation to fail the PR if metrics regress beyond thresholds.
      # Uncomment the following steps to enable hard gating (requires a gate config).
      #
      # Example gate config (gate_config.yaml):
      #   min_score:
      #     faithfulness: 0.8
      #   max_regression:
      #     precision_at_5: 0.05
      #
      # To use:
      # 1. Create a gate config file (e.g., gate_config.yaml) in your repository.
      # 2. Uncomment the steps below and adjust the paths as needed.
      #
      # - name: Evaluate quality gates
      #   id: gate
      #   run: |
      #     rageval gate ${{ needs.evaluate-pr.outputs.results-path }} ${{ needs.evaluate-main.outputs.results-path }} \
      #       --gate-config gate_config.yaml \
      #       --output ./gate_results.md
      # - name: Post gate results comment
      #   uses: marocchino/sticky-pull-request-comment=v2
      #   with:
      #     path: ./gate_results.md
      #     header: "ragmark-eval-gates"
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #
      # Note: The gate step will fail the job (and thus the PR) if any gate rule fails.

      - name: Post comment
        uses: marocchino/sticky-pull-request-comment=v2
        with:
          path: ./comparison.md
          header: "ragmark-eval-results"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
